name: Deploy to Droplet

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (git pull + restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: nexus.adithkb.dev
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /home/ubuntu/AgenticPKMApp
            git pull
            systemctl restart obsidian-capture
